clusterName: "elasticsearch"
nodeGroup: "master"
replicas: 1
minimumMasterNodes: 1

esJavaOpts: "-Xmx512m -Xms512m"

resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

persistence:
  enabled: false

antiAffinity: "soft"

sysctlInitContainer:
  enabled: false

service:
  type: ClusterIP
  port: 9200
