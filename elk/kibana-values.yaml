replicas: 1

resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

elasticsearchHosts: "http://elasticsearch-master:9200"

service:
  type: NodePort
  nodePort: 32601

kibanaConfig:
  kibana.yml: |
    server.host: 0.0.0.0
    xpack.security.enabled: false
    monitoring.enabled: false
